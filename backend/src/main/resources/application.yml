spring:
  application:
    name: roottrace

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: gemini-2.5-flash
        embedding:
          options:
            model: text-embedding-004

app:
  ai:
    diagnosis:
      max-context-chunks: 8
    retrieval:
      top-k: 10
      semantic-top-k: 20
      keyword-top-k: 20
      rrf-k: 60
      min-score: 0.0
    ingestion:
      chunk-size: 1200
      chunk-overlap: 150
      max-document-size: 10485760

  security:
    jwt:
      secret: ${JWT_SECRET:dGhpc2lzYWRlZmF1bHRzZWNyZXRrZXl0aGF0c2hvdWxkYmVhdGxlYXN0MjU2Yml0c2xvbmc=}
      access-token-expiration-ms: 900000 # 15 minutes
      refresh-token-expiration-ms: 604800000 # 7 days

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:roottrace}
    username: ${POSTGRES_USER:roottrace}
    password: ${POSTGRES_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
